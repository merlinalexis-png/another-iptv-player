name: Build Player Pop TV APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'player-pop-tv.patch'
      - 'ios-exportable-downloads.patch'
      - 'android-tv-compile-fix.patch'
      - '.github/workflows/build-player-pop-tv.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout build package
        uses: actions/checkout@v5
        with:
          path: control

      - name: Checkout audited upstream source
        uses: actions/checkout@v5
        with:
          repository: bsogulcan/another-iptv-player
          ref: ba8a6e577053a611d50b2c74de01e38277621093
          path: source

      - name: Apply audited fixes
        run: |
          git -C source apply ../control/ios-exportable-downloads.patch
          git -C source apply ../control/player-pop-tv.patch
          git -C source apply ../control/android-tv-compile-fix.patch

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: source/apps/android/**/*.gradle*

      - name: Install Android toolchain
        run: |
          SDKMANAGER_PATH="$(find "${ANDROID_HOME}/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "${SDKMANAGER_PATH}"
          "${SDKMANAGER_PATH}" \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;27.2.12479018' \
            'cmake;3.22.1'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Stage libmpv binaries
        run: make -C source/apps/android/Vendor/libmpv-android

      - name: Run tests and build APK
        working-directory: source/apps/android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: player-pop-tv-preview
          path: source/apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish Player Pop TV preview
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK='source/apps/android/app/build/outputs/apk/debug/app-debug.apk'
          TAG='player-pop-tv-v0.1'
          ASSET_NAME='Player-Pop-TV-v0.1-debug.apk'

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${APK}#${ASSET_NAME}" \
              --clobber \
              --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${TAG}" "${APK}#${ASSET_NAME}" \
              --prerelease \
              --title 'Player Pop TV v0.1 — préversion Freebox Pop' \
              --notes 'Première préversion Android TV conçue pour Freebox Pop. Installation manuelle (sideload) requise. Aucun identifiant ni contenu IPTV n’est inclus.' \
              --repo "${GITHUB_REPOSITORY}"
          fi
